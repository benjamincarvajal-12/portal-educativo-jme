<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escuela Secundaria José Manuel Estrada N°1 | Portal Educativo</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
}

/* WEB DETRAS */

#portal{
    position:fixed;
    inset:0;

    background:
    linear-gradient(
    rgba(0,0,0,.5),
    rgba(0,0,0,.5)),
    url('https://images.unsplash.com/photo-1509062522246-3755977927d7');

    background-size:cover;
    background-position:center;

    filter:blur(15px);

    transition:2s ease;
}

.contenido{
    color:white;
    text-align:center;
    margin-top:200px;
}

.contenido h1{
    font-size:60px;
}

.contenido p{
    font-size:20px;
    margin-top:15px;
}

/* VENTANA DE ACCESO */

#overlay{

    position:fixed;
    inset:0;

    display:flex;

    justify-content:center;
    align-items:center;

    transition:1s;
}

.panel{

    width:90%;
    max-width:700px;

    background:rgba(255,255,255,.1);

    backdrop-filter:blur(20px);

    border-radius:25px;

    border:1px solid rgba(255,255,255,.2);

    padding:40px;

    color:white;

    text-align:center;

    animation:entrada 1s ease;

}

.panel h1{
    margin-bottom:10px;
}

.roles{

    margin-top:30px;

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:15px;

}

.btn{

    padding:20px;

    border:none;

    background:rgba(255,255,255,.15);

    color:white;

    font-size:17px;

    border-radius:15px;

    cursor:pointer;

    transition:.3s;

}

.btn:hover{

    transform:translateY(-5px);

    background:rgba(255,255,255,.25);

}

.loader{

    display:none;

    margin-top:25px;

}

.spinner{

    width:50px;
    height:50px;

    border:4px solid rgba(255,255,255,.3);

    border-top:4px solid white;

    border-radius:50%;

    margin:auto;

    animation:girar 1s linear infinite;

}

@keyframes girar{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}

@keyframes entrada{

    from{
        opacity:0;
        transform:translateY(50px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

</style>

<style>
:root {
    color-scheme: dark;
    font-family: "Aptos", "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }

body {
    min-height: 100vh;
    height: auto;
    overflow-x: hidden;
    overflow-y: auto;
    background: #10233f;
}

#portal {
    background-image: linear-gradient(135deg, rgba(10, 28, 54, .82), rgba(26, 83, 133, .48)), url('https://images.unsplash.com/photo-1509062522246-3755977927d7');
    background-size: cover;
    background-position: center;
    filter: blur(7px) saturate(.8);
    transform: scale(1.04);
}

.contenido { margin-top: 0; }
.contenido h1, .panel h1 { font-family: Georgia, "Times New Roman", serif; }
.contenido h1 { font-size: 56px; }

#overlay {
    padding: 24px;
    background: linear-gradient(135deg, rgba(12, 35, 63, .24), rgba(12, 35, 63, .52));
}

.panel {
    width: min(100%, 680px);
    padding: clamp(28px, 6vw, 52px);
    border: 1px solid rgba(255, 255, 255, .3);
    border-radius: 10px;
    background: rgba(14, 38, 70, .78);
    box-shadow: 0 28px 80px rgba(5, 23, 21, .3);
    backdrop-filter: blur(18px);
}

.panel h1 { font-size: 36px; animation: title-arrive .8s cubic-bezier(.2, .75, .25, 1) both, title-glow 4.5s ease-in-out 1s infinite alternate; }
.panel > p { color: rgba(255, 255, 255, .78); }
.roles { gap: 12px; }

.btn {
    min-height: 76px;
    border: 1px solid rgba(255, 255, 255, .2);
    border-radius: 6px;
    background: rgba(255, 255, 255, .09);
    font-weight: 600;
    transform-style: preserve-3d;
    transition: transform .38s cubic-bezier(.2, .75, .25, 1), background .35s ease, box-shadow .35s ease, border-color .35s ease;
}

.btn:hover, .btn:focus-visible {
    transform: perspective(750px) translateY(-3px) rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg));
    border-color: #7dd3fc;
    background: rgba(125, 211, 252, .16);
    box-shadow: 0 12px 24px rgba(3, 12, 30, .2);
}

.btn:focus-visible { outline: 2px solid #7dd3fc; outline-offset: 3px; }
.spinner { border-top-color: #7dd3fc; }
.entry-register-link { display: block; margin-top: 16px; text-decoration: none; }

@media (max-width: 520px) {
    #overlay { padding: 16px; }
    .panel h1 { font-size: 29px; }
    .roles { grid-template-columns: 1fr; margin-top: 22px; }
    .btn { min-height: 58px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
<link rel="stylesheet" href="css/style.css">
<meta name="theme-color" content="#0F172A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="assets/jme-icon.svg">
</head>

<body class="entry-page" data-page="entry">

<div id="portal" class="entry-background">

    <div class="contenido">

        <h1>Portal Educativo</h1>

        <p>
        Secundario José Manuel Estrada N°1
        </p>

    </div>

</div>

<div id="overlay" class="entry-overlay">

    <div class="panel entry-panel">

        <p class="eyebrow">Portal Educativo · Comunidad · Aprendizaje</p>
        <h1>Escuela Secundaria<br>José Manuel Estrada N°1</h1>

        <p>Selecciona tu espacio de acceso</p>

        <div class="roles role-grid" id="roles">

            <button class="btn role-button" data-enter-role="Alumno" data-destination="alumno.html">
                👨‍🎓 Alumno
            </button>

            <button class="btn role-button" data-enter-role="Preceptor" data-destination="login.html?role=preceptor">

            </button>

            <button class="btn role-button" data-enter-role="Director" data-destination="login.html?role=director">
                👔 Director
            </button>

                ⚙️ Administrador
            </button>

        </div>
        <a class="btn entry-register-link" href="login.html?mode=register">📝 Registrarse</a>

        <div class="loader entry-loading" id="loader" aria-live="polite">

            <div class="spinner"></div>

            <h2 style="margin-top:15px;">
                Accediendo...
            </h2>

            <p data-entry-message>Cargando entorno educativo...</p>

        </div>

    </div>

</div>

<script src="js/app.js" defer></script>
<script src="js/auth.js" defer></script>

</body>
</html>
